<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navegação com Edição Rápida — preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#09090b; color:#f4f4f5; font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh; overflow-x:hidden; }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid #a1a1aa; outline-offset:2px; }

  /* TOPNAV NATIVO */
  .bar { border-bottom:1px solid #1f1f23; background:#09090b; position:sticky; top:0; z-index:40; }
  .bar-row { max-width:1180px; margin:0 auto; padding:0 24px; height:56px; display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; color:#f4f4f5; text-decoration:none; }
  .bar-right { display:flex; align-items:center; gap:12px; }
  .btn-new { background:#f4f4f5; color:#09090b; border:0; border-radius:8px; padding:6px 14px; font-weight:600; font-size:13px; text-decoration:none; }
  .tabs-nav { border-top:1px solid #18181b; background:#09090b; }
  .tabs-row { max-width:1180px; margin:0 auto; padding:0 24px; display:flex; gap:28px; overflow-x:auto; }
  .tab-btn { background:none; border:0; padding:12px 0; font-size:14px; font-weight:500; color:#a1a1aa; border-bottom:2px solid transparent; transition:all .15s; }
  .tab-btn:hover { color:#f4f4f5; }
  .tab-btn.active { color:#f4f4f5; font-weight:600; border-bottom-color:#a855f7; }

  /* CONTAINER E GRADE */
  main { max-width:1180px; margin:0 auto; padding:28px 24px 80px; }
  .grid-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .count-lbl { font-size:13px; color:#a1a1aa; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:20px; }

  /* CARD DO ACERVO COM BOTÃO DE EDIÇÃO NO HOVER */
  .card { background:#111114; border:1px solid #27272a; border-radius:16px; padding:20px; display:flex; flex-direction:column; justify-content:space-between; min-height:240px; position:relative; transition:border-color .15s; }
  .card:hover { border-color:#3f3f46; }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
  .card-user { display:flex; align-items:center; gap:12px; min-width:0; }
  .av { width:42px; height:42px; border-radius:50%; background:#27272a; border:1px solid #3f3f46; display:grid; place-items:center; font-weight:700; font-size:12px; color:#d4d4d8; flex:none; }
  .card-title { font-size:15px; font-weight:700; color:#f4f4f5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  
  /* BOTÃO EDITAR NO HOVER */
  .btn-card-edit { background:#18181b; border:1px solid #3f3f46; border-radius:6px; padding:4px 10px; font-size:12px; font-weight:500; color:#d4d4d8; opacity:0; transition:opacity .15s, background .15s; }
  .card:hover .btn-card-edit { opacity:1; }
  .btn-card-edit:hover { background:#27272a; color:#fff; }

  .card-desc { font-size:13.5px; line-height:1.55; color:#d4d4d8; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:16px; }
  .meta-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .b { font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:6px; }
  .b.i { background:rgba(59,130,246,.1); color:#60a5fa; border:1px solid rgba(59,130,246,.2); }
  .b.l { background:rgba(16,185,129,.1); color:#34d399; border:1px solid rgba(16,185,129,.2); }
  .b.t { background:#18181b; color:#d4d4d8; border:1px solid #27272a; font-weight:500; }

  /* DRAWER / SHEET LATERAL DE EDIÇÃO RÁPIDA */
  .drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.65); backdrop-filter:blur(3px); z-index:90; opacity:0; pointer-events:none; transition:opacity .2s; }
  .drawer-overlay.open { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:460px; max-width:92vw; background:#111114; border-left:1px solid #27272a; z-index:100; transform:translateX(100%); transition:transform .25s cubic-bezier(0.16, 1, 0.3, 1); display:flex; flex-direction:column; }
  .drawer.open { transform:translateX(0); }
  .drawer-head { padding:18px 20px; border-bottom:1px solid #1f1f23; display:flex; justify-content:space-between; align-items:center; }
  .drawer-title { font-size:16px; font-weight:700; color:#f4f4f5; }
  .btn-close { background:none; border:0; color:#a1a1aa; font-size:18px; padding:4px; }
  .btn-close:hover { color:#fff; }
  .btn-subtle { background:none; border:0; color:#a1a1aa; font-size:12px; cursor:pointer; padding:0; }
  .btn-subtle:hover { color:#f4f4f5; text-decoration:underline; }
  .drawer-body { padding:20px; overflow-y:auto; flex:1; }
  .drawer-foot { padding:16px 20px; border-top:1px solid #1f1f23; display:flex; justify-content:space-between; align-items:center; }
  
  .f-group { margin-bottom:14px; }
  label.f { display:block; font-size:12.5px; font-weight:500; color:#d4d4d8; margin-bottom:5px; }
  .txt { width:100%; background:#18181b; border:1px solid #3f3f46; border-radius:8px; padding:8px 12px; color:#fafafa; font:inherit; font-size:13.5px; }
  textarea.txt { resize:vertical; line-height:1.45; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:#18181b; border:1px solid #3f3f46; color:#d4d4d8; border-radius:8px; padding:5px 11px; font-size:12px; font-weight:500; }
  .chip[aria-pressed=true] { background:#f4f4f5; color:#09090b; border-color:#f4f4f5; }
  .chip.opt[aria-pressed=true]::before { content:"✓ "; font-weight:bold; }
  .chip:disabled { opacity:.35; cursor:not-allowed; }
  .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#18181b; border:1px solid #3f3f46; border-radius:8px; padding:8px 16px; display:none; font-size:13px; z-index:110; }
  .toast.on { display:block; }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-row">
    <a href="#" class="brand">
      <span>🧙🏻‍♂️</span>
      <span>Biblioteca Infinita</span>
    </a>
    <div class="bar-right">
      <nav style="display:flex; align-items:center; gap:6px;">
        <a href="preview-admin-navegacao.html" style="font-size:13px; font-weight:600; color:#f4f4f5; background:#18181b; padding:6px 12px; border-radius:6px; text-decoration:none; border:1px solid #27272a;">Conteúdos</a>
        <a href="preview-admin-novo.html" style="font-size:13px; color:#a1a1aa; padding:6px 12px; border-radius:6px; text-decoration:none;">+ Novo conteúdo</a>
        <a href="preview-admin-idiomas.html" style="font-size:13px; color:#a1a1aa; padding:6px 12px; border-radius:6px; text-decoration:none;">Idiomas</a>
      </nav>
    </div>
  </div>
  <nav class="tabs-nav">
    <div class="tabs-row">
      <button class="tab-btn active" data-tab="youtube" onclick="switchTab('youtube')">YouTube (4)</button>
      <button class="tab-btn" data-tab="professores" onclick="switchTab('professores')">Professores (2)</button>
      <button class="tab-btn" data-tab="podcasts" onclick="switchTab('podcasts')">Podcasts (0)</button>
      <button class="tab-btn" data-tab="series" onclick="switchTab('series')">Séries & Filmes (0)</button>
      <button class="tab-btn" data-tab="sites" onclick="switchTab('sites')">Sites (0)</button>
    </div>
  </nav>
</header>

<main>
  <div class="grid-header">
    <div class="count-lbl" id="gridCount">Exibindo 6 canais de imersão</div>
    <div style="font-size:12px; color:#a1a1aa;">Passe o mouse no card para editar</div>
  </div>

  <div class="grid" id="cardGrid"></div>
</main>

<!-- DRAWER DE EDIÇÃO RÁPIDA LATERAL -->
<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-title">Editar canal</div>
    <button class="btn-close" onclick="closeDrawer()" aria-label="Fechar">✕</button>
  </div>
  <div class="drawer-body">
    <div class="f-group">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
        <label class="f" for="eUrl" style="margin-bottom:0;">Link do canal</label>
        <button type="button" class="btn-subtle" id="btnDrawerRefresh" onclick="refreshDrawerMeta()" title="Buscar título, descrição e avatar do YouTube">↻ Buscar do YouTube</button>
      </div>
      <input id="eUrl" class="txt" placeholder="https://www.youtube.com/@canal">
    </div>
    <div class="f-group">
      <label class="f" for="eTitle">Título</label>
      <input id="eTitle" class="txt">
    </div>
    <div class="f-group">
      <label class="f" for="eDesc">Descrição</label>
      <textarea id="eDesc" class="txt" rows="3"></textarea>
    </div>
    <div class="f-group">
      <label class="f" for="eLang">Idioma</label>
      <select id="eLang" class="txt">
        <option value="german">🇩🇪 Alemão</option>
        <option value="english">🇺🇸 Inglês</option>
        <option value="french">🇫🇷 Francês</option>
        <option value="spanish">🇪🇸 Espanhol</option>
      </select>
    </div>
    <div class="row-2">
      <div class="f-group">
        <label class="f">Tipo</label>
        <div class="chips" id="dType">
          <button class="chip" data-solo aria-pressed="true">Imersão</button>
          <button class="chip" data-solo aria-pressed="false">Professor</button>
        </div>
      </div>
      <div class="f-group">
        <label class="f">Opções</label>
        <div class="chips" id="dOpt">
          <button class="chip opt" id="dIni" aria-pressed="false">Iniciante</button>
          <button class="chip opt" id="dLeg" aria-pressed="false">Legendado</button>
        </div>
      </div>
    </div>
    <div class="f-group">
      <label class="f" for="eTags">Tags</label>
      <input id="eTags" class="txt" placeholder="Separadas por vírgula">
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn-card-edit" onclick="deleteCurrent()" style="color:#ef4444; border-color:#7f1d1d;">Excluir</button>
    <button class="btn-new" onclick="saveDrawer()">Salvar alterações</button>
  </div>
</div>

<div class="toast" id="toast">Alterações salvas com sucesso.</div>

<script>
const SAMPLE_CHANNELS = [
  { id: "1", title: "Easy German", url: "https://www.youtube.com/@EasyGerman", desc: "Aprenda alemão com entrevistas autênticas de rua em Berlim e diálogos reais com legendas duplas.", cat: "youtube", ini: true, sub: true, tags: ["Cultura", "Entrevistas"] },
  { id: "2", title: "Kurzgesagt – In a Nutshell (DE)", url: "https://www.youtube.com/@KurzgesagtDE", desc: "Vídeos de ciência, filosofia e tecnologia explicados com animações incríveis em alemão nativo.", cat: "youtube", ini: false, sub: true, tags: ["Ciência", "Animação"] },
  { id: "3", title: "Tagesschau", url: "https://www.youtube.com/@tagesschau", desc: "O principal telejornal e cobertura diária de notícias da televisão pública alemã.", cat: "youtube", ini: false, sub: true, tags: ["Notícias", "Política"] },
  { id: "4", title: "MrWissen2go", url: "https://www.youtube.com/@MrWissen2go", desc: "História mundial, questões contemporâneas e geopolítica explicadas de forma didática para nativos.", cat: "youtube", ini: false, sub: false, tags: ["História", "Cultura"] },
  { id: "5", title: "Deutsch mit Marija", url: "https://www.youtube.com/@DeutschmitMarija", desc: "Aulas estruturadas de gramática, vocabulário e dicas para os exames Goethe e telc.", cat: "professores", ini: false, sub: true, tags: ["Gramática", "Exames"] },
  { id: "6", title: "Learn German with Anja", url: "https://www.youtube.com/@LearnGermanwithAnja", desc: "Aulas dinâmicas e bem-humoradas para estudantes que estão dando os primeiros passos no alemão.", cat: "professores", ini: false, sub: true, tags: ["Iniciante", "Gramática"] }
];

let channels = [...SAMPLE_CHANNELS];
let currentTab = 'youtube';
let editingId = null;

function updateTabCounts(){
  const counts = { youtube: 0, professores: 0, podcasts: 0, series: 0, sites: 0 };
  channels.forEach(c => {
    if(counts[c.cat] !== undefined) counts[c.cat]++;
  });
  document.querySelectorAll('.tab-btn').forEach(b => {
    const t = b.getAttribute('data-tab');
    const label = t === 'youtube' ? 'YouTube' :
                  t === 'professores' ? 'Professores' :
                  t === 'podcasts' ? 'Podcasts' :
                  t === 'series' ? 'Séries & Filmes' : 'Sites';
    b.textContent = `${label} (${counts[t] || 0})`;
  });
}

function renderGrid(){
  const list = channels.filter(c => c.cat === currentTab);
  const tabLabel = currentTab === 'youtube' ? 'Imersão' :
                   currentTab === 'professores' ? 'Professores' :
                   currentTab === 'podcasts' ? 'Podcasts' :
                   currentTab === 'series' ? 'Séries & Filmes' : 'Sites';
  document.getElementById('gridCount').textContent = `Exibindo ${list.length} conteúdos (${tabLabel})`;
  const container = document.getElementById('cardGrid');

  if(list.length === 0){
    container.innerHTML = `
      <div style="grid-column: 1 / -1; padding: 48px 24px; text-align: center; color: #71717a; border: 1px dashed #27272a; border-radius: 12px; font-size: 14px;">
        Nenhum conteúdo cadastrado nesta categoria ainda.
      </div>
    `;
    return;
  }

  container.innerHTML = list.map(c => `
    <div class="card">
      <div>
        <div class="card-top">
          <div class="card-user">
            <div class="av">${c.title.slice(0,2).toUpperCase()}</div>
            <div class="card-title">${c.title}</div>
          </div>
          <button class="btn-card-edit" onclick="openDrawer('${c.id}')">Editar</button>
        </div>
        <div class="card-desc">${c.desc}</div>
      </div>
      <div>
        <div class="meta-row">
          ${c.ini && c.cat !== 'professores' ? '<span class="b i">Iniciante</span>' : ''}
          ${c.sub ? '<span class="b l">Legendado</span>' : ''}
        </div>
        <div class="meta-row">
          ${c.tags.map(t => `<span class="b t">${t}</span>`).join('')}
        </div>
      </div>
    </div>
  `).join('');
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-tab') === tab);
  });
  renderGrid();
}

function openDrawer(id){
  editingId = id;
  const item = channels.find(c => c.id === id);
  if(!item) return;

  document.getElementById('eUrl').value = item.url || '';
  document.getElementById('eTitle').value = item.title;
  document.getElementById('eDesc').value = item.desc;
  document.getElementById('eTags').value = item.tags.join(', ');

  const typeSolo = document.querySelectorAll('#dType [data-solo]');
  const isTeacher = item.cat === 'professores';
  typeSolo[0].setAttribute('aria-pressed', !isTeacher);
  typeSolo[1].setAttribute('aria-pressed', isTeacher);

  const iniBtn = document.getElementById('dIni');
  iniBtn.disabled = isTeacher;
  iniBtn.setAttribute('aria-pressed', item.ini && !isTeacher);
  document.getElementById('dLeg').setAttribute('aria-pressed', item.sub);

  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function refreshDrawerMeta(){
  const btn = document.getElementById('btnDrawerRefresh');
  btn.innerHTML = '<span>↻</span><span>Buscando...</span>';
  setTimeout(() => {
    btn.innerHTML = '<span>↻</span><span>Buscar do YouTube</span>';
    const item = channels.find(c => c.id === editingId);
    if(item){
      document.getElementById('eTitle').value = item.title + " (Oficial YouTube)";
      document.getElementById('eDesc').value = "Metadados oficiais re-extraídos com sucesso diretamente da página do canal no YouTube.";
      const t = document.getElementById('toast');
      t.textContent = 'Metadados e ícone atualizados do YouTube.';
      t.classList.add('on');
      setTimeout(()=>t.classList.remove('on'), 3000);
    }
  }, 400);
}

function closeDrawer(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  editingId = null;
}

function saveDrawer(){
  const item = channels.find(c => c.id === editingId);
  if(!item) return;

  item.title = document.getElementById('eTitle').value;
  item.desc = document.getElementById('eDesc').value;
  item.tags = document.getElementById('eTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  
  const isTeacher = document.querySelectorAll('#dType [data-solo]')[1].getAttribute('aria-pressed') === 'true';
  item.cat = isTeacher ? 'professores' : 'youtube';
  item.ini = !isTeacher && document.getElementById('dIni').getAttribute('aria-pressed') === 'true';
  item.sub = document.getElementById('dLeg').getAttribute('aria-pressed') === 'true';

  closeDrawer();
  updateTabCounts();
  renderGrid();

  const t = document.getElementById('toast');
  t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 3000);
}

function deleteCurrent(){
  if(!confirm('Excluir este conteúdo do acervo?')) return;
  channels = channels.filter(c => c.id !== editingId);
  closeDrawer();
  updateTabCounts();
  renderGrid();
}

// TOGGLES NO DRAWER
document.getElementById('dType').addEventListener('click', e => {
  const b = e.target.closest('[data-solo]'); if(!b) return;
  document.querySelectorAll('#dType [data-solo]').forEach(x => x.setAttribute('aria-pressed', x === b));
  const isTeacher = b.textContent === 'Professor';
  const iniBtn = document.getElementById('dIni');
  iniBtn.disabled = isTeacher;
  if(isTeacher) iniBtn.setAttribute('aria-pressed', 'false');
});

document.getElementById('dOpt').addEventListener('click', e => {
  const b = e.target.closest('.chip.opt'); if(!b || b.disabled) return;
  const curr = b.getAttribute('aria-pressed') === 'true';
  b.setAttribute('aria-pressed', !curr);
});

// INICIALIZAÇÃO
updateTabCounts();
renderGrid();
</script>
</body>
</html>
